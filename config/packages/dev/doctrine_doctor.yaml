doctrine_doctor:
    enabled: true

    analysis:
        exclude_third_party_entities: true
        exclude_paths: []

    analyzers:
        n_plus_one:
            enabled: true
            threshold: 3
        slow_query:
            enabled: true
            threshold: 10
        missing_index:
            enabled: true
            slow_query_threshold: 5
            explain_queries: true
            min_rows_scanned: 500
        hydration:
            enabled: true
            row_threshold: 1000
            critical_threshold: 5000

    profiler:
        show_in_toolbar: true
